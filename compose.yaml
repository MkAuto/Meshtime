# Put DOMAIN=cal.example.com in a .env file next to this compose.yaml, and PORT=3001 (any free port) for each extra instance.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      PORT: ${PORT:-3000}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PORT: ${PORT:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
  caddy_data:
  caddy_config:
