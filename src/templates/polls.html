<h1>{{t.polls.title}}</h1>
<p><a class="btn" href="/polls/new">{{t.polls.new}}</a></p>
<ul class="polls">
  {{#polls}}
  <li>
    <a href="/polls/{{id}}">{{title}}</a>
    <small>{{status}}</small>
    {{#toAnswer}}<b class="to-answer">{{t.polls.toAnswer}}</b>{{/toAnswer}}
  </li>
  {{/polls}}
  {{^polls}}
  <li class="hint">{{t.polls.none}}</li>
  {{/polls}}
</ul>
