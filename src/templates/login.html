<h1>{{t.login.title}}</h1>
{{> notices}}
<form method="post" action="/login" class="stack">
  <label>{{t.login.name}} <input name="name" required maxlength="40" autocomplete="username" autofocus></label>
  <label>{{t.login.password}} <input name="password" type="password" required autocomplete="current-password"></label>
  <button>{{t.login.button}}</button>
</form>
{{! data-error: app.js shows it when the passkey login fails with no message of its own. }}
<p id="passkey-login" hidden data-error="{{t.errors.generic}}">
  {{t.login.or}} <button class="link">{{t.login.withPasskey}}</button> <span class="err"></span>
</p>
<p class="hint">{{t.login.noAccount}}</p>
