{{! Six date rows are the no-JS fallback; public/app.js collapses them to one and grows rows on demand,
    up to data-max. }}
<h1>New poll</h1>
<form method="post" action="/polls/new" class="stack">
  <label>
    What for?
    <input name="title" required maxlength="100" placeholder="Board game night" value="{{title}}" autofocus>
  </label>
  {{#errors.title}}<p class="err">{{errors.title}}</p>{{/errors.title}}
  <fieldset class="stack dates" data-max="{{maxDates}}">
    <legend>Proposed dates (max {{maxDates}})</legend>
    <noscript class="hint">Leave extras empty.</noscript>
    <input type="date" name="dates">
    <input type="date" name="dates">
    <input type="date" name="dates">
    <input type="date" name="dates">
    <input type="date" name="dates">
    <input type="date" name="dates">
  </fieldset>
  {{#errors.dates}}<p class="err">{{errors.dates}}</p>{{/errors.dates}}
  <button>Create poll</button>
</form>
